name: Elite Pitch CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'back-end/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd back-end
          npm ci

      - name: Run Test Suite
        run: |
          cd back-end
          npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_jwt_secret_key_testing_12345
